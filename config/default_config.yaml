# UCMP baseline configuration
project:
  name: "Universal Cloud Migration Platform"
  version: "1.0.0"

source:
  platform: "azure_databricks"
  repo_path: "ucmp-demo/Loan-Platform"
  workspace_url: "https://adb-simulated.azuredatabricks.net"
  source_mode: "local_repo"
  workspace_path: "/"

target:
  platform: "aws_databricks"
  repo_path: "ucmp-demo/output/aws-migrated"
  workspace_url: "https://simulated.cloud.databricks.com"
  catalog_name: "main"

pipeline:
  fail_fast: true
  dry_run: true

rules:
  rules_dir: "ucmp-demo/mappings"

deployment:
  # Safe default: analyze/validate only; do not write to Databricks.
  auto_deploy: false

output:
  mode: "in_place"
  reports_dir: "ucmp-demo/reports"
  knowledge_model_dir: "ucmp-demo/reports/knowledge_model"

logging:
  level: "INFO"

migration:
  notebook_list:
    - "/PFL/Delta-Lake/Qlik_Reporting/FinnOne_Receipts_Summary_Report/Report/Product_wise_summary"
    - "/PFL/Delta-Lake/Qlik_Reporting/FinnOne_Receipts_Summary_Report/Write CSV/write_to_csv_account_classification_wise_summary"
    - "/PFL/Delta-Lake/Qlik_Reporting/FinnOne_Receipts_Summary_Report/Write CSV/write_to_csv_dpdbucket_wise_summary"
    - "/PFL/Delta-Lake/Qlik_Reporting/FinnOne_Receipts_Summary_Report/Write CSV/write_to_csv_finnone_receipts_summary"
    - "/PFL/Delta-Lake/Qlik_Reporting/FinnOne_Receipts_Summary_Report/Write CSV/write_to_csv_product_wise_summary"

  notebook_list_file: ""
  notebook_path_column: "Notebook Path"

  # Used for existing /workspace/... notebook references.
  workspace_root: "/Workspace/Users/charless.binny@poonawallafincorp.com/pfl-repo-dbx-datalake"

  # Used specifically for hardcoded referred-notebook/repository paths such as
  # /Workspace/pfl-repo-dbx-datalake/<notebook>.
  # The repository name is retained automatically; this value is the configurable root.
  referred_notebook_path_root: "/Workspace/Users/charless.binny@poonawallafincorp.com"

  bucket_variable: "bucket"

  container_bucket_mapping:
    appsflyer: "bkt-dl-raw-dev-appsflyer-aps1"
    bedrock-agentcore: "bkt-dl-raw-dev-bedrock-agentcore-aps1"
